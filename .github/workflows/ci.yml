# SPDX-License-Identifier: Apache-2.0
name: CI

# When what runs: a push to a branch runs this unit stage, make check (vet, staticcheck,
# race tests with coverage, govulncheck); a pull request against main additionally runs
# integration.yml (short fuzzing). Everything is checked before the merge: main takes
# squash-merged pull requests only, up to date with main and with every required check
# green, so nothing runs after the merge. scheduled.yml scans for vulnerabilities every
# night and fuzzes twice a week for the corpus. Long fuzzing and the mutation tests run for
# a release candidate (release.yml).
on:
  push:
    branches-ignore: [main, "release/[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go (vet, staticcheck, race tests, coverage, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make check
