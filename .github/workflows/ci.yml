# SPDX-License-Identifier: Apache-2.0
name: CI

# When what runs: a push to a branch runs this unit stage, make check (vet, staticcheck,
# race tests with coverage, govulncheck); a pull request against main additionally runs
# integration.yml (short fuzzing). Everything is checked before the merge: main takes
# squash-merged pull requests only, up to date with main and with every required check
# green, so nothing runs after the merge. scheduled.yml scans for vulnerabilities every
# night and fuzzes twice a month. Mutation tests run before releases.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go (vet, staticcheck, race tests, coverage, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check
