# SPDX-License-Identifier: Apache-2.0
name: CI

# Every push to any branch runs make check (vet, staticcheck, race tests with coverage,
# govulncheck). Pull requests against main (every push into them), pushes to main and
# manual runs additionally fuzz every target briefly. main is protected: changes only via
# squash-merged pull requests with all checks green. Mutation tests run before releases.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go (vet, staticcheck, race tests, coverage, govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make check

  fuzz:
    name: Fuzz (short)
    # Integration stage: pull requests, main and manual runs; not plain branch pushes.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=60s
