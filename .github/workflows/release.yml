# SPDX-License-Identifier: Apache-2.0
name: Release

# A tag vX.Y.0-alpha.N, vX.Y.Z-rc.N or vX.Y.Z publishes a GitHub release with the conformance
# report of that commit (conformance-report.yml). The release is created as a draft, the report
# is attached to the draft, and only a draft with the attested report is published. A published
# release is immutable (repository setting), so nothing can be added or replaced afterwards; a
# failed run leaves a draft and needs a new version.
#
# A release is a tag, not a commit (RELEASING.md of the organization): a release candidate is
# tagged on release/X.Y, published, and then runs the release gate: long fuzzing of every
# target and the mutation tests. The version is tagged on the commit of a release candidate
# whose gate passed; this workflow then publishes without testing again.
#
# Guards: only admins may create tags and tags are immutable (repository rulesets). Before
# anything is published, home-mandate/.github/actions/release-verify checks where the tag
# stands, that the commit came from a merged pull request whose checks passed, that a version
# is a release candidate that passed, and that the release doesn't exist. Here: a release
# candidate and a version need their entry in the changelog of SPEC-v0.md. The Go module proxy
# serves a tag on its own: these guards keep a wrong tag from becoming a release, not from
# existing, which is why they come with the tag ruleset.
#
# Run by hand with a tag name, the workflow only checks whether that tag could be released
# from the head of the chosen branch, and publishes nothing. Do it before every tag:
#   gh workflow run release.yml --ref release/X.Y -f tag=vX.Y.Z-rc.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: the tag to check on the head of this branch. Publishes nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
      actions: read # the run of the release candidate a version stands on
    outputs:
      kind: ${{ steps.verify.outputs.kind }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches' history and the tags, to check where the tag stands
          persist-credentials: false

      - id: verify
        uses: home-mandate/.github/actions/release-verify@f73af670bc516d6556a0203315b90c0c6554852f
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          required-checks: |
            Go (
            Fuzz (

      # The entry is written before the first release candidate: the version is its commit.
      - name: The changelog entry
        if: steps.verify.outputs.kind != 'alpha'
        env:
          BASE: ${{ steps.verify.outputs.base }}
        run: |
          if ! grep -qE "^### v${BASE//./\\.}( |$)" SPEC-v0.md; then
            echo "::error::SPEC-v0.md has no changelog entry for v$BASE"; exit 1
          fi

  release:
    name: Create the draft
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # the release
    steps:
      # A re-run of failed jobs finds the draft of the first attempt and keeps it.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2> /dev/null); then
            [ "$draft" = true ] || { echo "::error::release $TAG is published already"; exit 1; }
            echo "The draft of $TAG exists from an earlier attempt"; exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes "${flags[@]}"

  conformance-report:
    name: Conformance report
    needs: release
    permissions:
      contents: write # the release asset
      id-token: write # the attestation's signing certificate
      attestations: write
    uses: ./.github/workflows/conformance-report.yml
    with:
      tag: ${{ github.ref_name }}

  # The draft becomes the release only with the attested report attached.
  publish:
    name: Publish the release
    needs: conformance-report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release
      attestations: read # the report's provenance
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: The report is attached and attested
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir" --pattern 'conformance-report*.json'
          for file in conformance-report.json; do
            [ -f "$dir/$file" ] || { echo "::error::$file is not attached to the draft of $TAG"; exit 1; }
            gh attestation verify "$dir/$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish the draft
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The release gate, for a release candidate only: what is too long for every pull request.
  # The targets come from FUZZ_TARGETS of the Makefile.
  fuzz-targets:
    name: Fuzz targets
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(make -s fuzz-targets | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # Every target for 20 minutes on top of the corpus the runs of scheduled.yml have collected,
  # at most four at a time: the organization runs 20 jobs at the same time at most.
  fuzz:
    name: Fuzz (long, ${{ matrix.target }})
    needs: fuzz-targets
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Where Go keeps the corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # The key never matches: the newest corpus with the prefix is restored.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-
      - run: make fuzz-one FUZZ="$TARGET" FUZZTIME=20m
        env:
          TARGET: ${{ matrix.target }}
      # A failing input is written to testdata/fuzz; keep it to reproduce the failure.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # At least 90 % of the injected faults must be found by the tests (make mutation).
  mutation:
    name: Mutation tests
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make mutation

  # The job release-verify looks for before a version may stand on this commit: it succeeds
  # only if the release candidate was published and every part of the gate passed.
  gate:
    name: Release gate
    needs: [verify, publish, fuzz-targets, fuzz, mutation]
    if: always() && github.event_name == 'push' && needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "verify, publish, fuzz-targets, fuzz, mutation: $RESULTS"
          [ "$RESULTS" = "success success success success success" ]
