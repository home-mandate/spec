# SPDX-License-Identifier: Apache-2.0
name: Conformance report

# Runs mandate-conformance against the reference code (cmd/mandate-harness) at the tag of a
# published release and attaches the report to that release as conformance-report.json, with
# build provenance (gh attestation verify conformance-report.json --repo home-mandate/spec).
# home-mandate.org shows a conformance class as passed only with such a report.
# Runs when a release is published, or by hand for an existing release (input: its tag).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. v0.1.0-rc.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conformance-report-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  run:
    name: Run mandate-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOWORK: "off"
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Check the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run mandate-conformance
        run: |
          # The report names the release, not "devel" (SPEC-v0 section 10.4).
          go build -ldflags "-X github.com/home-mandate/spec/internal/harness.Version=${TAG#v}" -o bin/mandate-harness ./cmd/mandate-harness
          go run ./cmd/mandate-conformance -report conformance-report.json \
            -classes evaluator,selection,signatures,audit,audit-anchored -exec bin/mandate-harness

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report*.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and write to the release.
  publish:
    name: Attest and attach
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report*.json

      # Never replaces an attached report; a re-run adds only what is missing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in conformance-report*.json; do
            if grep -qxF "$file" <<< "$attached"; then echo "$file is already attached"; continue; fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
