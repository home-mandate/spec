# SPDX-License-Identifier: Apache-2.0
name: Scheduled

# Checks that do not depend on a change: vulnerabilities in dependencies become known
# without a commit (every night), and long fuzzing finds what the short runs in pull
# requests do not (on the 1st and 15th of every month). A failure opens an issue, or
# comments on the open one; main itself is never changed by these runs.
on:
  schedule:
    - cron: "11 2 * * *" # security, every night
    - cron: "23 3 1,15 * *" # fuzzing, twice a month
  workflow_dispatch:
    inputs:
      what:
        description: "security or fuzz"
        required: true
        default: security
        type: choice
        options: [security, fuzz]

permissions:
  contents: read

jobs:
  # The newest release branch gets the same check: it only gets patches and no dependency
  # updates, so a finding there is fixed like any other bug (RELEASING.md).
  branches:
    name: Branches to check
    if: github.event.schedule == '11 2 * * *' || inputs.what == 'security'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - id: list
        run: |
          set -euo pipefail
          newest=$(git ls-remote --heads "https://github.com/$GITHUB_REPOSITORY" 'release/*' |
            sed 's#.*refs/heads/##' | grep -E '^release/[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "refs=$(jq -cn --arg newest "$newest" '["main"] + (if $newest == "" then [] else [$newest] end)')" >> "$GITHUB_OUTPUT"

  security:
    name: Security (govulncheck), ${{ matrix.ref }}
    needs: branches
    if: github.event.schedule == '11 2 * * *' || inputs.what == 'security'
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.branches.outputs.refs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vulncheck

  # The targets come from FUZZ_TARGETS of the Makefile: a new target is fuzzed here without a
  # second list to keep.
  fuzz-targets:
    name: Fuzz targets
    if: github.event.schedule == '23 3 1,15 * *' || inputs.what == 'fuzz'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(make -s fuzz-targets | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # One job for each target, at most four at a time: all in one job took 271 of the 300 minutes
  # that a job may run, and the organization runs 20 jobs at the same time at most. The name
  # starts with "Fuzz (" as release.yml expects of the short fuzzing.
  fuzz:
    name: Fuzz (long, ${{ matrix.target }})
    needs: fuzz-targets
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz-one FUZZ="$TARGET" FUZZTIME=45m
        env:
          TARGET: ${{ matrix.target }}
      # A failing input is written to testdata/fuzz; keep it to reproduce the failure.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  report:
    name: Report a failure
    needs: [branches, security, fuzz-targets, fuzz]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Scheduled check failed: ${{ github.event.schedule == '11 2 * * *' && 'security' || 'fuzzing' }}"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN"
          fi
